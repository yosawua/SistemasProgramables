; PlatformIO Project Configuration File
; Proyecto: Banda Transportadora Clasificadora y Dosificadora
; Hardware: ESP32 DevKit V1
; Equipo: Los Pythones

[platformio]
default_envs = main
src_dir = src
include_dir = include
test_dir = test

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -I include
    -D CORE_DEBUG_LEVEL=1

; ==============================================================================
; ENTORNO PRINCIPAL DE PRODUCCIÓN
; ==============================================================================
[env:main]
build_src_filter = +<main.cpp>
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ILI9341 @ ^1.6.0
    adafruit/Adafruit BusIO @ ^1.15.0
    dfrobot/DFRobotDFPlayerMini @ ^1.0.6
    mathieucarbou/ESPAsyncWebServer @ ^3.1.5
    mathieucarbou/AsyncTCP @ ^3.1.4

; ==============================================================================
; ENTORNOS INDEPENDIENTES DE DIAGNÓSTICO Y PRUEBA DE HARDWARE
; ==============================================================================

; 1. Prueba de Sensor Inductivo LJ12A3-4-Z/BX (GPIO 34 con pull-up externo a 3.3V)
[env:test_inductivo]
build_src_filter = -<*> +<../test/test_inductivo.cpp>

; 2. Prueba de Sensor Infrarrojo FC-51 (GPIO 35)
[env:test_ir]
build_src_filter = -<*> +<../test/test_ir.cpp>

; 3. Prueba de Motor DC con TB6612FNG Canal A (PWM, avance, reversa)
[env:test_motor]
build_src_filter = -<*> +<../test/test_motor.cpp>

; 4. Prueba de Electroválvula 12V con TB6612FNG Canal B (apertura y cierre 2s)
[env:test_valvula]
build_src_filter = -<*> +<../test/test_valvula.cpp>

; 5. Prueba de Pantalla TFT 2.8" ILI9341 SPI (gráficos, colores y texto)
[env:test_tft]
build_src_filter = -<*> +<../test/test_tft.cpp>
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ILI9341 @ ^1.6.0
    adafruit/Adafruit BusIO @ ^1.15.0

; 6. Prueba de DFPlayer Mini por Serial2 (UART2 GPIO 16/17 con R=1k)
[env:test_dfplayer]
build_src_filter = -<*> +<../test/test_dfplayer.cpp>
lib_deps =
    dfrobot/DFRobotDFPlayerMini @ ^1.0.6

; 7. Prueba de Servidor Web Asíncrono y SoftAP WiFi
[env:test_web]
build_src_filter = -<*> +<../test/test_web.cpp>
lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.1.5
    mathieucarbou/AsyncTCP @ ^3.1.4
